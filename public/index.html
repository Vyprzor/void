<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>VOID</title>
<style>
*{box-sizing:border-box} :root{--bg:#050508;--p:#0d0d14;--p2:#12121c;--line:#272738;--mut:#85859a;--a:#8b5cf6}
body{margin:0;background:var(--bg);color:#f4f4f7;font:14px Inter,system-ui,sans-serif;overflow:hidden}
.shell{display:grid;grid-template-columns:230px 1fr;height:100vh}.side{border-right:1px solid var(--line);background:linear-gradient(180deg,#0c0c12,#07070b);padding:18px 12px;overflow:auto}.logo{font-size:23px;font-weight:900;letter-spacing:8px;padding:8px 10px 25px}
.label{font-size:10px;letter-spacing:2px;color:#65657a;margin:18px 10px 8px}.nav{display:flex;align-items:center;gap:11px;padding:10px;border-radius:11px;cursor:pointer;color:#b8b8c7}.nav:hover,.nav.active{background:#171724;color:white}.nav img{width:29px;height:29px;border-radius:8px;object-fit:cover}.main{min-width:0;display:flex;flex-direction:column}
.tabs{height:42px;background:#08080d;border-bottom:1px solid var(--line);display:flex;align-items:end;padding-left:10px;gap:4px}.tab{max-width:190px;padding:9px 13px;border:1px solid var(--line);border-bottom:0;background:#111119;border-radius:10px 10px 0 0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.tab b{margin-left:12px;color:#777;cursor:pointer}
.toolbar{height:58px;display:flex;gap:7px;padding:9px;background:#0b0b11;border-bottom:1px solid var(--line)}button{border:1px solid #303041;background:#14141d;color:white;border-radius:11px;min-width:40px;cursor:pointer}.go{background:var(--a);border:0;padding:0 17px}.addr{flex:1;background:#111119;border:1px solid #303041;border-radius:12px;color:#eee;padding:0 14px;outline:none}
#view{flex:1;overflow:auto;position:relative}.home{min-height:100%;display:grid;place-items:center;text-align:center;background:radial-gradient(circle at 50% 10%,#251642 0,#08080d 35%,#050508 70%)}.home h1{font-size:clamp(75px,11vw,150px);margin:0;letter-spacing:-8px;background:linear-gradient(#fff,#676778);color:transparent;background-clip:text}.home p{color:var(--mut);letter-spacing:4px}
.web{background:white;color:#111;min-height:100%;width:100%;overflow:auto}.web a{cursor:pointer}.status{position:absolute;left:50%;top:20px;transform:translateX(-50%);padding:10px 15px;border:1px solid var(--line);border-radius:12px;background:#101018;color:#aaa;z-index:3}
.cards{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.card{height:75px;border:1px solid var(--line);border-radius:13px;background:#111119;overflow:hidden;cursor:pointer;position:relative}.card img{width:100%;height:100%;object-fit:cover;opacity:.65}.card span{position:absolute;left:8px;bottom:7px;font-size:11px;font-weight:700;text-shadow:0 2px 5px #000}
@media(max-width:750px){.shell{grid-template-columns:70px 1fr}.logo{font-size:13px;letter-spacing:2px}.nav span,.label{display:none}.nav{justify-content:center}.cards{grid-template-columns:1fr}.card span{display:none}}
</style></head><body><div class="shell">
<aside class="side"><div class="logo">VOID</div><div class="nav active" onclick="home()">⌂ <span>Home</span></div>
<div class="label">APPS</div>
<div class="nav" onclick="visit('https://www.tiktok.com')"><img src="https://www.google.com/s2/favicons?domain=tiktok.com&sz=64"><span>TikTok</span></div>
<div class="nav" onclick="visit('https://discord.com/app')"><img src="https://www.google.com/s2/favicons?domain=discord.com&sz=64"><span>Discord</span></div>
<div class="nav" onclick="visit('https://www.roblox.com')"><img src="https://www.google.com/s2/favicons?domain=roblox.com&sz=64"><span>Roblox</span></div>
<div class="nav" onclick="visit('https://www.snapchat.com')"><img src="https://www.google.com/s2/favicons?domain=snapchat.com&sz=64"><span>Snapchat</span></div>
<div class="nav" onclick="visit('https://www.youtube.com')"><img src="https://www.google.com/s2/favicons?domain=youtube.com&sz=64"><span>YouTube</span></div>
<div class="label">GAMES</div><div class="cards">
<div class="card" onclick="visit('https://www.crazygames.com')"><img src="https://www.google.com/s2/favicons?domain=crazygames.com&sz=128"><span>CrazyGames</span></div>
<div class="card" onclick="visit('https://poki.com')"><img src="https://www.google.com/s2/favicons?domain=poki.com&sz=128"><span>Poki</span></div>
<div class="card" onclick="visit('https://2048game.com')"><img src="https://www.google.com/s2/favicons?domain=2048game.com&sz=128"><span>2048</span></div>
<div class="card" onclick="visit('https://lichess.org')"><img src="https://www.google.com/s2/favicons?domain=lichess.org&sz=128"><span>Chess</span></div></div></aside>
<section class="main"><div class="tabs" id="tabs"></div><div class="toolbar"><button onclick="back()">←</button><button onclick="forward()">→</button><button onclick="reload()">↻</button><input class="addr" id="addr" placeholder="Search or enter an address" onkeydown="if(event.key==='Enter')go()"><button class="go" onclick="go()">GO</button><button onclick="newTab()">＋</button></div><main id="view"></main></section>
</div><script>
let T=[],active=-1;
function mk(){return{id:crypto.randomUUID(),title:"New Tab",url:"",hist:[],pos:-1}}
function newTab(){T.push(mk());active=T.length-1;renderTabs();home()}
function renderTabs(){tabs.innerHTML=T.map((t,i)=>`<div class="tab" onclick="selectTab(${i})">${esc(t.title)} <b onclick="event.stopPropagation();closeTab(${i})">×</b></div>`).join("")}
function selectTab(i){active=i;renderTabs();let t=T[i];if(t.url)load(t.url,false);else home()}
function closeTab(i){T.splice(i,1);if(!T.length)return newTab();active=Math.min(active,T.length-1);selectTab(active)}
function home(){let t=T[active];if(t){t.url="";t.title="New Tab"}addr.value="";view.innerHTML=`<div class="home"><div><h1>VOID</h1><p>ENTER THE NETWORK</p></div></div>`;renderTabs()}
function target(s){s=s.trim();if(/^https?:\/\//i.test(s))return s;if(/^[\w.-]+\.[a-z]{2,}(\/.*)?$/i.test(s))return"https://"+s;return"https://en.wikipedia.org/w/index.php?search="+encodeURIComponent(s)}
function go(){visit(target(addr.value))}
function visit(u){let t=T[active];t.hist=t.hist.slice(0,t.pos+1);t.hist.push(u);t.pos++;load(u,true)}
async function load(u){let t=T[active];t.url=u;addr.value=u;view.innerHTML='<div class="status">Loading through VOID…</div>';try{let r=await fetch("/api/page?url="+encodeURIComponent(u)),d=await r.json();if(!r.ok)throw Error(d.error);t.url=d.url;t.title=d.title||"Page";addr.value=d.url;renderTabs();let doc=new DOMParser().parseFromString(d.html,"text/html");doc.querySelectorAll("script").forEach(x=>x.remove());view.innerHTML='<div class="web" id="web"></div>';let styles=[...doc.head.querySelectorAll('style,link[rel="stylesheet"]')];styles.forEach(x=>web.appendChild(x));[...doc.body.childNodes].forEach(x=>web.appendChild(x));web.querySelectorAll("[data-void-url]").forEach(a=>a.onclick=e=>{e.preventDefault();visit(a.dataset.voidUrl)})}catch(e){view.innerHTML=`<div class="home"><div><h2>Page couldn't be rendered</h2><p>${esc(e.message)}</p><p style="color:#777">Some interactive web apps require their original site.</p></div></div>`}}
function back(){let t=T[active];if(t.pos>0){t.pos--;load(t.hist[t.pos])}}function forward(){let t=T[active];if(t.pos<t.hist.length-1){t.pos++;load(t.hist[t.pos])}}function reload(){let t=T[active];if(t.url)load(t.url)}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
newTab();
</script></body></html>
